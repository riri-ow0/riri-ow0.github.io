<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 900" preserveAspectRatio="xMinYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Vine drawing. Colors and speed are in the style block below. -->
<style>
  .stem { fill:none; stroke:#3F8A55; stroke-width:5; stroke-linecap:round; stroke-dasharray:1 2; stroke-dashoffset:1; animation:grow 3.6s cubic-bezier(.3,.6,.3,1) forwards; }
  .thin { stroke-width:3; animation-duration:4.2s; }
  .leaf { transform:scale(0); animation:pop .6s ease-out forwards; }
  .a { fill:#6DB874; }
  .b { fill:#8FCB8A; }
  @keyframes grow { to { stroke-dashoffset:0; } }
  @keyframes pop { to { transform:scale(1); } }
  @media (prefers-color-scheme:dark) { .stem { stroke:#4E9C63; } .a { fill:#4E9C63; } .b { fill:#6DB874; } }
  @media (prefers-reduced-motion:reduce) { .stem { animation:none; stroke-dashoffset:0; } .leaf { animation:none; transform:none; } }
</style>
